# KEDA ScaledObjects — event-driven autoscaling driven by Prometheus metrics.
# Unlike HPA (which only uses CPU/memory), KEDA can scale on any metric.
# This means order-service scales proportionally to actual request load,
# not proxy metrics like CPU that lag behind traffic spikes.

---
apiVersion: keda.sh/v1alpha1
kind: ScaledObject
metadata:
  name: order-service-scaler
  namespace: staging
spec:
  scaleTargetRef:
    name: order-service
  minReplicaCount: 1
  maxReplicaCount: 10
  cooldownPeriod: 60   # seconds before scaling down after traffic drops
  pollingInterval: 15  # how often KEDA checks the Prometheus metric
  triggers:
    - type: prometheus
      metadata:
        serverAddress: http://prometheus-operated.monitoring.svc.cluster.local:9090
        metricName: http_requests_per_second
        # Scale out when request rate exceeds 100 req/s per replica
        threshold: "100"
        query: sum(rate(http_requests_total{job="order-service"}[1m]))

---
apiVersion: keda.sh/v1alpha1
