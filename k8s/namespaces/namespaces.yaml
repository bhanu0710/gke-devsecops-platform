# All platform namespaces defined in one file for easy review.
# istio-injection: enabled causes Istio to inject proxies into all pods in the namespace.
# This enables mTLS, traffic management, and observability without code changes.
---
apiVersion: v1
kind: Namespace
metadata:
  name: staging
  labels:
    env: staging
    istio-injection: enabled
    app.kubernetes.io/managed-by: argocd
---
apiVersion: v1
kind: Namespace
metadata:
  name: prod
  labels:
    env: prod
    istio-injection: enabled
    app.kubernetes.io/managed-by: argocd
---
apiVersion: v1
kind: Namespace
metadata:
  name: monitoring
  labels:
    istio-injection: enabled
---
apiVersion: v1
kind: Namespace
metadata:
  name: security
  labels:
    istio-injection: enabled
---
apiVersion: v1
kind: Namespace
metadata:
  name: argocd
  labels:
    istio-injection: disabled  # ArgoCD has its own TLS; injecting Istio causes conflicts
---
apiVersion: v1
kind: Namespace
metadata:
  name: jenkins
  labels:
    istio-injection: enabled
---
apiVersion: v1
kind: Namespace
metadata:
  name: chaos-testing
  labels:
    istio-injection: enabled
---
# Tenant namespaces — each tenant gets an isolated namespace with ResourceQuotas
apiVersion: v1
kind: Namespace
metadata:
  name: tenant-a
  labels:
    tenant: tenant-a
    istio-injection: enabled
---
apiVersion: v1
kind: Namespace
metadata:
  name: tenant-b
  labels:
    tenant: tenant-b
    istio-injection: enabled
---
apiVersion: v1
kind: Namespace
metadata:
  name: tenant-c
  labels:
    tenant: tenant-c
    istio-injection: enabled
