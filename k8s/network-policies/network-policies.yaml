# Network policies enforced by GKE Dataplane V2 (eBPF).
# Default: deny all ingress AND egress from every namespace.
# Then explicitly allow only the required communication paths.
# This implements a zero-trust network model inside the cluster.

# ── Default deny-all for staging ─────────────────────────────────────────────
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: default-deny-all
  namespace: staging
spec:
  podSelector: {}  # Applies to all pods in the namespace
  policyTypes:
    - Ingress
    - Egress

# ── Allow DNS (required for all pods to resolve service names) ───────────────
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-dns
  namespace: staging
spec:
  podSelector: {}
  policyTypes:
    - Egress
  egress:
    - ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53

# ── user-service: accept from order-service and ingress gateway ──────────────
# Istio AuthorizationPolicy enforces this at L7; NetworkPolicy enforces at L4.
# Running both provides defense-in-depth — a misconfigured AuthorizationPolicy
# is caught by the NetworkPolicy layer.
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: user-service-ingress
  namespace: staging
spec:
  podSelector:
    matchLabels:
      app: user-service
  policyTypes:
    - Ingress
    - Egress
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app: order-service
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: istio-system  # Ingress gateway
      ports:
        - port: 3000
  egress:
    - ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53
    # Allow outbound to monitoring for metrics scraping
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: monitoring
      ports:
        - port: 9090

# ── product-service: accept from order-service and ingress gateway ────────────
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: product-service-ingress
  namespace: staging
spec:
  podSelector:
    matchLabels:
      app: product-service
  policyTypes:
    - Ingress
    - Egress
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app: order-service
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: istio-system
      ports:
        - port: 8000
  egress:
    - ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53

# ── order-service: accept from ingress gateway; egress to user + product ─────
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: order-service-policy
  namespace: staging
spec:
  podSelector:
    matchLabels:
      app: order-service
  policyTypes:
    - Ingress
    - Egress
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: istio-system
      ports:
        - port: 3001
  egress:
    - to:
        - podSelector:
            matchLabels:
              app: user-service
      ports:
        - port: 3000
    - to:
        - podSelector:
            matchLabels:
              app: product-service
      ports:
        - port: 8000
    - ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53

# ── Same policies for prod namespace ─────────────────────────────────────────
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: default-deny-all
  namespace: prod
spec:
  podSelector: {}
  policyTypes:
    - Ingress
    - Egress

# ── Tenant isolation: tenants cannot reach each other ───────────────────────
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: deny-cross-tenant
  namespace: tenant-a
spec:
  podSelector: {}
  policyTypes:
    - Ingress
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              tenant: tenant-a  # Only allow from same tenant namespace
