apiVersion: v1
kind: ServiceAccount
metadata:
  name: spot-taint-remover
  namespace: kube-system
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: spot-taint-remover
rules:
- apiGroups: [""]
  resources: ["nodes"]
  verbs: ["get", "patch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: spot-taint-remover
subjects:
- kind: ServiceAccount
  name: spot-taint-remover
  namespace: kube-system
roleRef:
  kind: ClusterRole
  name: spot-taint-remover
  apiGroup: rbac.authorization.k8s.io
---
# DaemonSet: removes cloud.google.com/gke-spot NoSchedule taint from every node.
# Required for all-spot clusters where system pods (kube-dns, ArgoCD, etc.)
# don't have the spot toleration but need to run somewhere.
apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: spot-taint-remover
  namespace: kube-system
spec:
  selector:
    matchLabels:
      app: spot-taint-remover
  template:
    metadata:
      labels:
        app: spot-taint-remover
    spec:
      tolerations:
      - key: cloud.google.com/gke-spot
        operator: Exists
        effect: NoSchedule
      - operator: Exists
      serviceAccountName: spot-taint-remover
      hostNetwork: false
      containers:
      - name: taint-remover
        image: bitnami/kubectl:latest
        command:
        - /bin/sh
        - -c
        - |
          NODE=$(cat /etc/hostname)
          kubectl taint node "$NODE" cloud.google.com/gke-spot=true:NoSchedule- 2>/dev/null || true
          echo "Spot taint removed from $NODE (or was already absent)"
          # Sleep forever — pod stays Running so DaemonSet doesn't restart it
          sleep infinity
        env:
        - name: NODE_NAME
          valueFrom:
            fieldRef:
              fieldPath: spec.nodeName
        resources:
          requests:
            cpu: "10m"
            memory: "32Mi"
          limits:
            cpu: "50m"
            memory: "64Mi"
