# Cloud Build alternative CI — free 120 min/day on Cloud Build (vs Jenkins which needs nodes).
# Useful when GKE nodes are scaled to zero and you don't want to pay to scale them up for CI.
# Same 9 logical stages as the Jenkinsfile, adapted to Cloud Build step syntax.

steps:

  # ── Stage 1: Checkout (implicit — Cloud Build checks out the source automatically) ──

  # ── Stage 2: Dependency Audit ────────────────────────────────────────────────
  - name: node:20-alpine
    id: audit-user
    entrypoint: sh
    args:
      - -c
      - cd services/user-service && npm ci --quiet && npm audit --audit-level=high
    waitFor: ['-']

  - name: python:3.12-slim
    id: audit-product
    entrypoint: sh
    args:
      - -c
      - pip install pip-audit --quiet && pip-audit -r services/product-service/requirements.txt
    waitFor: ['-']

  - name: node:20-alpine
    id: audit-order
    entrypoint: sh
    args:
      - -c
      - cd services/order-service && npm ci --quiet && npm audit --audit-level=high
    waitFor: ['-']

  # ── Stage 3: Unit Tests ────────────────────────────────────────────────────
  - name: node:20-alpine
    id: test-user
    entrypoint: sh
    args:
      - -c
      - cd services/user-service && npm ci --quiet && npm test
    waitFor: [audit-user]

  - name: python:3.12-slim
    id: test-product
    entrypoint: sh
    args:
      - -c
      - |
        pip install -r services/product-service/requirements.txt pytest pytest-cov --quiet
        cd services/product-service && pytest src/ --cov=src --cov-fail-under=70 -v
    waitFor: [audit-product]

  - name: node:20-alpine
    id: test-order
    entrypoint: sh
    args:
      - -c
      - cd services/order-service && npm ci --quiet && npm test
    waitFor: [audit-order]

  # ── Stage 5: Docker Builds (run in parallel to save time) ─────────────────
  - name: gcr.io/cloud-builders/docker
    id: build-user
    args:
      - buildx
      - build
      - --platform=linux/amd64
      - --tag=us-central1-docker.pkg.dev/$PROJECT_ID/devsecops-platform/user-service:$SHORT_SHA
      - --cache-from=us-central1-docker.pkg.dev/$PROJECT_ID/devsecops-platform/user-service:latest
      - services/user-service
    waitFor: [test-user]

  - name: gcr.io/cloud-builders/docker
    id: build-product
    args:
      - buildx
      - build
      - --platform=linux/amd64
      - --tag=us-central1-docker.pkg.dev/$PROJECT_ID/devsecops-platform/product-service:$SHORT_SHA
      - --cache-from=us-central1-docker.pkg.dev/$PROJECT_ID/devsecops-platform/product-service:latest
      - services/product-service
    waitFor: [test-product]

  - name: gcr.io/cloud-builders/docker
    id: build-order
    args:
      - buildx
      - build
      - --platform=linux/amd64
      - --tag=us-central1-docker.pkg.dev/$PROJECT_ID/devsecops-platform/order-service:$SHORT_SHA
      - --cache-from=us-central1-docker.pkg.dev/$PROJECT_ID/devsecops-platform/order-service:latest
      - services/order-service
    waitFor: [test-order]

  # ── Stage 6: Trivy Image Scans ────────────────────────────────────────────
  - name: aquasec/trivy:latest
    id: trivy-user
    args:
      - image
      - --exit-code=1
      - --severity=CRITICAL,HIGH
      - --no-progress
      - us-central1-docker.pkg.dev/$PROJECT_ID/devsecops-platform/user-service:$SHORT_SHA
    waitFor: [build-user]

  - name: aquasec/trivy:latest
    id: trivy-product
    args:
      - image
      - --exit-code=1
      - --severity=CRITICAL,HIGH
      - --no-progress
      - us-central1-docker.pkg.dev/$PROJECT_ID/devsecops-platform/product-service:$SHORT_SHA
    waitFor: [build-product]

  - name: aquasec/trivy:latest
    id: trivy-order
    args:
      - image
      - --exit-code=1
      - --severity=CRITICAL,HIGH
      - --no-progress
      - us-central1-docker.pkg.dev/$PROJECT_ID/devsecops-platform/order-service:$SHORT_SHA
    waitFor: [build-order]

  # ── Stage 7: Cosign image signing ─────────────────────────────────────────
  - name: gcr.io/projectsigstore/cosign:v2.2.3
    id: sign-images
    entrypoint: sh
    args:
      - -c
      - |
        COSIGN_KEY="gcpkms://projects/$PROJECT_ID/locations/global/keyRings/cosign-keyring/cryptoKeys/cosign-key/cryptoKeyVersions/1"
        for svc in user-service product-service order-service; do
          cosign sign --key $COSIGN_KEY --yes \
            us-central1-docker.pkg.dev/$PROJECT_ID/devsecops-platform/$svc:$SHORT_SHA
        done
    waitFor: [trivy-user, trivy-product, trivy-order]

  # ── Stage 8: Push to Artifact Registry ────────────────────────────────────
  - name: gcr.io/cloud-builders/docker
    id: push-user
    args: [push, us-central1-docker.pkg.dev/$PROJECT_ID/devsecops-platform/user-service:$SHORT_SHA]
    waitFor: [sign-images]

  - name: gcr.io/cloud-builders/docker
    id: push-product
    args: [push, us-central1-docker.pkg.dev/$PROJECT_ID/devsecops-platform/product-service:$SHORT_SHA]
    waitFor: [sign-images]

  - name: gcr.io/cloud-builders/docker
    id: push-order
    args: [push, us-central1-docker.pkg.dev/$PROJECT_ID/devsecops-platform/order-service:$SHORT_SHA]
    waitFor: [sign-images]

  # ── Stage 9: Update Helm values (GitOps trigger) ──────────────────────────
  - name: gcr.io/cloud-builders/git
    id: update-helm
    entrypoint: sh
    args:
      - -c
      - |
        git config user.email "cloudbuild@devsecops-platform.internal"
        git config user.name "Cloud Build"
        for svc in user-service product-service order-service; do
          sed -i "s|tag: .*|tag: \"$SHORT_SHA\"|" helm/$svc/values-staging.yaml
        done
        git add helm/
        git diff --cached --quiet || git commit -m "chore: bump image tags to $SHORT_SHA [ci skip]"
        git push origin HEAD:main
    waitFor: [push-user, push-product, push-order]

images:
  - us-central1-docker.pkg.dev/$PROJECT_ID/devsecops-platform/user-service:$SHORT_SHA
  - us-central1-docker.pkg.dev/$PROJECT_ID/devsecops-platform/product-service:$SHORT_SHA
  - us-central1-docker.pkg.dev/$PROJECT_ID/devsecops-platform/order-service:$SHORT_SHA

options:
  machineType: E2_HIGHCPU_8
  logging: CLOUD_LOGGING_ONLY

timeout: 2400s # 40 minutes
