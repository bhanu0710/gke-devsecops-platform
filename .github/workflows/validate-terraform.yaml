name: Validate Terraform

on:
  pull_request:
    paths:
      - 'terraform/**'
  push:
    branches: [main]
    paths:
      - 'terraform/**'

jobs:
  validate:
    name: Terraform Validate & Format
    runs-on: ubuntu-latest
    strategy:
      matrix:
        environment: [staging, prod]
    steps:
      - uses: actions/checkout@v4

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.6.6"

      - name: Terraform Format Check
        run: terraform fmt -check -recursive terraform/

      - name: Terraform Init (${{ matrix.environment }})
        run: |
          terraform -chdir=terraform/environments/${{ matrix.environment }} \
            init -backend=false -input=false

      - name: Terraform Validate (${{ matrix.environment }})
        run: |
          terraform -chdir=terraform/environments/${{ matrix.environment }} validate

      - name: Checkov Security Scan
        uses: bridgecrewio/checkov-action@master
        with:
          directory: terraform/
          framework: terraform
          soft_fail: true
          output_format: cli
