# GitHub Actions CI — runs on every push to main and all PRs.
# Uses Workload Identity Federation (no service account JSON key stored as secret).
# WIF exchanges a short-lived GitHub OIDC token for a GCP access token.
name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  REGISTRY: us-central1-docker.pkg.dev/${{ vars.GCP_PROJECT_ID }}/devsecops-platform

jobs:
  # ── Lint ────────────────────────────────────────────────────────────────────
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: |
            services/user-service/package-lock.json
            services/order-service/package-lock.json

      - name: Lint Node services
        run: |
          for svc in user-service order-service; do
            echo "=== Linting $svc ==="
            cd services/$svc && npm ci --quiet && npx eslint src/ --ext .js 2>/dev/null || echo "ESLint not configured, skipping"
            cd ../..
          done

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Lint Python service
        run: |
          pip install ruff --quiet
          ruff check services/product-service/src/

  # ── Unit Tests ──────────────────────────────────────────────────────────────
  test:
    name: Unit Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: |
            services/user-service/package-lock.json
            services/order-service/package-lock.json

      - name: Test user-service
        run: cd services/user-service && npm ci --quiet && npm test

      - name: Test order-service
        run: cd services/order-service && npm ci --quiet && npm test

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Test product-service
        run: |
          # Use venv to match Dockerfile; setuptools==67.8.0 provides pkg_resources
          # needed by opentelemetry-instrumentation==0.43b0
          python -m venv /tmp/product-venv
          /tmp/product-venv/bin/pip install --quiet \
            -r services/product-service/requirements.txt pytest pytest-cov
          cd services/product-service && \
            /tmp/product-venv/bin/pytest src/ --cov=src --cov-report=xml -v

      - name: Upload coverage reports
        uses: codecov/codecov-action@v4
        with:
          files: services/product-service/coverage.xml
        continue-on-error: true

  # ── Security Scan ────────────────────────────────────────────────────────────
  security-scan:
    name: Security Scan (Trivy)
    runs-on: ubuntu-latest
    permissions:
      security-events: write  # Required to upload SARIF results to GitHub Security tab
    steps:
      - uses: actions/checkout@v4

      - name: Run Trivy on Dockerfiles (config scan)
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: config
          scan-ref: services/
          format: sarif
          output: trivy-config.sarif
          severity: HIGH,CRITICAL

      - name: Upload SARIF to GitHub Security
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: trivy-config.sarif

  # ── Build Check (no push on PRs) ─────────────────────────────────────────────
  build-check:
    name: Docker Build Check
    runs-on: ubuntu-latest
    strategy:
      matrix:
        service: [user-service, product-service, order-service]
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build image (no push)
        uses: docker/build-push-action@v5
        with:
          context: services/${{ matrix.service }}
          platforms: linux/amd64
          push: false
          tags: ${{ env.REGISTRY }}/${{ matrix.service }}:pr-check
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ── Push (main branch only) ───────────────────────────────────────────────────
  push:
    name: Push to Artifact Registry
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    needs: [lint, test, security-scan, build-check]
    permissions:
      contents: write
      id-token: write  # Required for Workload Identity Federation
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      # WIF avoids storing a long-lived service account JSON key as a GitHub secret.
      # GitHub's OIDC provider issues a short-lived token; GCP exchanges it for
      # a scoped access token via the configured WIF provider.
      - name: Authenticate to GCP via Workload Identity Federation
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ secrets.GCP_SERVICE_ACCOUNT }}

      - name: Configure Docker for Artifact Registry
        run: gcloud auth configure-docker us-central1-docker.pkg.dev --quiet

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push all services
        env:
          IMAGE_TAG: ${{ github.sha }}
        run: |
          SHORT_SHA="${IMAGE_TAG:0:8}"
          for svc in user-service product-service order-service; do
            echo "=== Building and pushing $svc:$SHORT_SHA ==="
            docker buildx build \
              --platform linux/amd64 \
              --tag $REGISTRY/$svc:$SHORT_SHA \
              --tag $REGISTRY/$svc:latest \
              --push \
              services/$svc
          done

      - name: Update Helm values
        env:
          IMAGE_TAG: ${{ github.sha }}
        run: |
          SHORT_SHA="${IMAGE_TAG:0:8}"
          git config user.email "ci@devsecops-platform.internal"
          git config user.name "CI Pipeline"
          for svc in user-service product-service order-service; do
            # Update staging tag (values-staging.yaml overrides)
            sed -i "s|tag: .*|tag: \"$SHORT_SHA\"|" helm/$svc/values-staging.yaml
            # Update default tag in values.yaml (picked up by prod ArgoCD app)
            sed -i "s|tag: .*|tag: \"$SHORT_SHA\"|" helm/$svc/values.yaml
          done
          git add helm/
          git diff --cached --quiet || git commit -m "chore: bump image tags to $SHORT_SHA [ci skip]"
          git push
