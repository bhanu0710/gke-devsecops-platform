# SLO definitions using Pyrra — generates PrometheusRule and Grafana dashboards automatically.
# Pyrra takes these SLO specs and creates:
# 1. Recording rules for error budget calculation
# 2. Alerting rules for burn rate (both fast and slow)
# 3. A Grafana dashboard with error budget remaining
#
# 99.9% availability = 43.8 min/month downtime budget (30-day window)

---
apiVersion: pyrra.dev/v1alpha1
kind: ServiceLevelObjective
metadata:
  name: order-service-availability
  namespace: monitoring
spec:
  description: "order-service must handle 99.9% of requests without 5xx errors"
  target: "99.9"
  window: 30d
  indicator:
    ratio:
      errors:
        metric: http_requests_total{job="order-service",status=~"5.."}
      total:
        metric: http_requests_total{job="order-service"}

---
apiVersion: pyrra.dev/v1alpha1
