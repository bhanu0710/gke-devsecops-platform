---
# Latency SLO: 95% of requests must complete within 500ms
apiVersion: pyrra.dev/v1alpha1
kind: ServiceLevelObjective
metadata:
  name: order-service-latency
  namespace: monitoring
spec:
  description: "95% of order-service requests must complete in < 500ms"
  target: "95"
  window: 30d
  indicator:
    latency:
      success:
        metric: http_request_duration_seconds_bucket{job="order-service",le="0.5"}
      total:
        metric: http_request_duration_seconds_count{job="order-service"}
