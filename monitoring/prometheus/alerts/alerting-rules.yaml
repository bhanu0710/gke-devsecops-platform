apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: platform-alerting-rules
  namespace: monitoring
  labels:
    release: prometheus
spec:
  groups:
    - name: slo_alerts
      rules:
        # ── Error rate above SLO threshold ────────────────────────────────────
        - alert: HighErrorRate
          expr: job:request_error_rate:ratio_rate5m > 0.05
          for: 5m
          labels:
            severity: critical
            team: platform
          annotations:
            summary: "Error rate above 5% for {{ $labels.job }}"
            description: |
              Service {{ $labels.job }} has an error rate of {{ $value | humanizePercentage }}.
              SLO threshold: 0.1% per month = 5% in any 5-minute window triggers this alert.
            runbook_url: "https://github.com/bhanupratapsingh/gke-devsecops-platform/blob/main/docs/runbooks/incident-response.md"

        # ── Error budget fast burn rate ───────────────────────────────────────
        # Fires when we're consuming the 30-day error budget at 14.4x normal rate.
        # 14.4x = consuming the entire 30-day budget in 50 hours — requires immediate action.
        - alert: ErrorBudgetBurnRateFast
          expr: job:request_error_rate:ratio_rate5m > (14.4 * 0.001)
          for: 5m
          labels:
            severity: page
            team: platform
          annotations:
            summary: "Fast burn rate — error budget depleting quickly for {{ $labels.job }}"
            description: |
              {{ $labels.job }} is consuming its error budget at {{ $value | humanizePercentage }} error rate.
              At this rate, the 30-day 99.9% SLO budget will be exhausted in < 50 hours.

        # ── High latency ──────────────────────────────────────────────────────
        - alert: HighP99Latency
          expr: job:request_latency_p99:histogram_quantile > 2.0
          for: 10m
          labels:
            severity: warning
          annotations:
            summary: "P99 latency above 2s for {{ $labels.job }}"
            description: "P99 latency is {{ $value | humanizeDuration }}"

    - name: infrastructure_alerts
      rules:
        # ── Pod restart loop ──────────────────────────────────────────────────
        - alert: PodCrashLooping
          expr: |
            rate(kube_pod_container_status_restarts_total[15m]) * 60 * 15 > 3
          for: 5m
          labels:
            severity: warning
          annotations:
            summary: "Pod {{ $labels.pod }} is crash looping"
            description: "Pod {{ $labels.namespace }}/{{ $labels.pod }} has restarted {{ $value | humanize }} times in 15m"

        # ── Node memory pressure ──────────────────────────────────────────────
        - alert: NodeMemoryPressure
          expr: node:memory_utilization:ratio > 0.85
          for: 5m
          labels:
            severity: warning
          annotations:
            summary: "Node memory above 85%: {{ $labels.node }}"

        # ── Spot node preemption ──────────────────────────────────────────────
        # GKE emits this metric when a spot node is preempted (reclaimed by Google).
        # Alerts ops to check if the autoscaler is bringing up replacement nodes.
        - alert: SpotNodePreempted
          expr: kube_node_spec_taint{key="cloud.google.com/gke-spot",effect="NoSchedule"} == 0
          for: 2m
          labels:
            severity: info
          annotations:
            summary: "Spot node {{ $labels.node }} appears to have been preempted"

    - name: argocd_alerts
      rules:
        - alert: ArgoCDAppOutOfSync
          expr: argocd_app_info{sync_status="OutOfSync"} == 1
          for: 10m
          labels:
            severity: warning
          annotations:
            summary: "ArgoCD app {{ $labels.name }} is out of sync"
            description: "App {{ $labels.name }} has been OutOfSync for > 10 minutes. Check git repo and cluster state."
