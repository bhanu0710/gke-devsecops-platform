replicaCount: 3
resources:
  requests:
    cpu: "200m"
    memory: "256Mi"
  limits:
    cpu: "1000m"
    memory: "512Mi"
autoscaling:
  minReplicas: 3
  maxReplicas: 20
extraEnv:
  - name: USER_SERVICE_URL
    value: "http://user-service.prod.svc.cluster.local:3000"
  - name: PRODUCT_SERVICE_URL
    value: "http://product-service.prod.svc.cluster.local:8000"
