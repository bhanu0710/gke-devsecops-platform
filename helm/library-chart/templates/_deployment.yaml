{{/*
_deployment.yaml — reusable Deployment template.
Usage in a service chart's templates/deployment.yaml:
  {{ include "library-chart.deployment" . }}
*/}}
{{- define "library-chart.deployment" -}}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Release.Name }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "library-chart.labels" . | nindent 4 }}
  annotations:
    # Reloader watches this annotation — restarts pods when referenced secrets/configmaps change
    reloader.stakater.com/auto: "true"
spec:
  replicas: {{ .Values.replicaCount | default 2 }}
  selector:
    matchLabels:
      app: {{ .Release.Name }}
  template:
    metadata:
      labels:
        app: {{ .Release.Name }}
        version: {{ .Values.image.tag | quote }}
        {{- include "library-chart.labels" . | nindent 8 }}
      annotations:
        # Prometheus scrape config — service-level annotations are authoritative
        prometheus.io/scrape: "true"
        prometheus.io/path: "/metrics"
        prometheus.io/port: {{ .Values.service.port | quote }}
        # Istio sidecar injection is controlled at namespace level, but this
        # annotation lets us opt individual pods in/out if needed
        sidecar.istio.io/inject: {{ .Values.istio.inject | default "true" | quote }}
    spec:
      serviceAccountName: {{ .Release.Name }}
      # Tolerate spot node taint — all workloads are stateless and can be evicted
      tolerations:
        - key: cloud.google.com/gke-spot
          operator: Exists
          effect: NoSchedule
      # Spread pods across nodes for HA — even with spot VMs
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: DoNotSchedule
          labelSelector:
            matchLabels:
              app: {{ .Release.Name }}
      containers:
        - name: {{ .Release.Name }}
          image: {{ .Values.image.repository }}:{{ .Values.image.tag }}
          imagePullPolicy: Always
          ports:
            - containerPort: {{ .Values.service.port }}
              name: http
          env:
            - name: VERSION
              value: {{ .Values.image.tag | quote }}
            - name: NODE_ENV
              value: {{ .Values.env | default "production" | quote }}
            {{- with .Values.extraEnv }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
          # Liveness: kills and restarts the container if it stops responding
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 30
            periodSeconds: 10
            failureThreshold: 3
          # Readiness: removes from Service endpoints until ready to accept traffic
          readinessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 10
            periodSeconds: 5
            failureThreshold: 2
          # Resource requests/limits are MANDATORY — enforced by OPA policy K8sRequireResourceLimits
          resources:
            requests:
              cpu: {{ .Values.resources.requests.cpu | default "100m" | quote }}
              memory: {{ .Values.resources.requests.memory | default "128Mi" | quote }}
            limits:
              cpu: {{ .Values.resources.limits.cpu | default "500m" | quote }}
              memory: {{ .Values.resources.limits.memory | default "256Mi" | quote }}
          securityContext:
            # runAsNonRoot enforced by OPA K8sNoRootContainers policy.
            # runAsUser must be numeric (Kubernetes can't verify named users).
            # distroless nonroot=65532; python slim appuser=1001.
            runAsNonRoot: true
            runAsUser: {{ if .Values.securityContext }}{{ .Values.securityContext.runAsUser | default 65532 }}{{ else }}65532{{ end }}
            readOnlyRootFilesystem: true
            allowPrivilegeEscalation: false
            capabilities:
              drop: [ALL]
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      volumes:
        # Read-only root filesystem requires a writable /tmp for temp files
        - name: tmp
          emptyDir: {}
      # Graceful termination: give pods 30s to drain in-flight requests
      terminationGracePeriodSeconds: 30
{{- end -}}
