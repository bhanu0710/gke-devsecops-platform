{{- define "library-chart.serviceaccount" -}}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ .Release.Name }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "library-chart.labels" . | nindent 4 }}
  annotations:
    # Workload Identity annotation binds this K8s SA to a GCP SA.
    # The GCP SA has roles/secretmanager.secretAccessor.
    # Pods using this SA get a GCP token without any JSON key file.
    iam.gke.io/gcp-service-account: {{ .Values.workloadIdentity.gcpServiceAccount | quote }}
automountServiceAccountToken: true
{{- end -}}
