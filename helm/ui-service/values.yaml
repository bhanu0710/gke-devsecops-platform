replicaCount: 1
team: platform

image:
  repository: us-central1-docker.pkg.dev/dev-project-494110/devsecops-platform/ui-service
  tag: "d1146553"

service:
  port: 80

env: production

workloadIdentity:
  gcpServiceAccount: app-sa@dev-project-494110.iam.gserviceaccount.com

resources:
  requests:
    cpu: "30m"
    memory: "32Mi"
  limits:
    cpu: "100m"
    memory: "64Mi"

autoscaling:
  minReplicas: 1
  maxReplicas: 2

istio:
  inject: "false"

ingress:
  enabled: false

# nginx runs as user 1001 (set in Dockerfile)
securityContext:
  runAsUser: 1001
  readOnlyRootFilesystem: false   # nginx writes to /var/cache/nginx and /var/run

# nginx serves index.html at / not /health
probes:
  liveness:
    path: /
  readiness:
    path: /

# nginx needs writable cache and run dirs
extraVolumeMounts:
  - name: nginx-cache
    mountPath: /var/cache/nginx
  - name: nginx-run
    mountPath: /var/run

extraVolumes:
  - name: nginx-cache
    emptyDir: {}
  - name: nginx-run
    emptyDir: {}
